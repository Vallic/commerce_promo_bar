commerce_promo_bar.settings:
  type: config_entity
  label: 'Promo bar settings'
  mapping:
    background_color:
      type: mapping
      label: 'Default background color'
      mapping:
        color:
          type: string
          label: 'Color'
        opacity:
          type: integer
          label: 'Opacity'
    text_color:
      type: mapping
      label: 'Default text color'
      mapping:
        color:
          type: string
          label: 'Color'
        opacity:
          type: integer
          label: 'Opacity'

block.settings.promo_bar_block:
  type: block_settings
  label: 'Promo bar block'
  mapping:
    stack:
      type: boolean
      label: 'Stack promo bars'

field.widget.settings.commerce_promo_bar_promotion:
  type: mapping
  label: 'Existing or new promotion widget settings'
  mapping:
    form_mode:
      type: string
      label: 'Form mode of new promotions'
